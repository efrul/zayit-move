# Builds ZayitMove.exe on Windows with the C# compiler that ships with it, runs the self-test on fake libraries,
# and on a v* tag publishes a release with the file.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Self-test
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process dist\ZayitMove.exe -ArgumentList '--selftest', "`"$dir`"" -Wait -PassThru
          Get-Content "$dir\report.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw 'self-test failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: ZayitMove
          path: dist/ZayitMove.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ZayitMove.exe --title "העברת הספרייה של זית $GITHUB_REF_NAME" --notes-file .github/release-notes.md
