# Builds ZayitMove.exe on Windows with the C# compiler that ships with it and runs the self-test on fake libraries.
# Only when started by hand (Actions → Build → Run workflow); given a version it also publishes a release with the file.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'גרסה לפרסום, למשל v1.0.1 (ריק: בנייה בלבד, בלי פרסום)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Self-test
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process dist\ZayitMove.exe -ArgumentList '--selftest', "`"$dir`"" -Wait -PassThru
          Get-Content "$dir\report.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw 'self-test failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: ZayitMove
          path: dist/ZayitMove.exe

      - name: Release
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/ZayitMove.exe --target "$GITHUB_SHA" --title "העברת הספרייה של זית $VERSION" --notes-file .github/release-notes.md
